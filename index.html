<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>솥뚜껑 포럼</title>
  <meta name="description" content="뜨겁게 끓고, 든든하게 덮어주는 이야기 마당 — 솥뚜껑 포럼">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="솥뚜껑 포럼 홈">
        <svg class="logo" viewBox="230 180 1416 1180" aria-hidden="true">
          <path class="logo-tree" fill="#2f8f50" d="M413 478Q436 450 460 478L555 830Q560 860 528 860H345Q313 860 320 830Z"/>
          <circle class="logo-leaf" fill="#7fc24d" cx="655" cy="566" r="138"/>
          <rect class="logo-ink" fill="#20362b" x="627" y="690" width="56" height="170" rx="14"/>
          <path class="logo-tree" fill="#2f8f50" d="M914 218Q938 190 962 218L1113 830Q1118 860 1086 860H790Q758 860 764 830Z"/>
          <circle class="logo-leaf" fill="#7fc24d" cx="1217" cy="598" r="130"/>
          <rect class="logo-ink" fill="#20362b" x="1189" y="710" width="56" height="150" rx="14"/>
          <path class="logo-tree" fill="#2f8f50" d="M1416 446Q1439 418 1462 446L1557 830Q1562 860 1530 860H1348Q1316 860 1322 830Z"/>
          <rect class="logo-ink" fill="#20362b" x="243" y="881" width="1390" height="105" rx="52"/>
          <path class="logo-ink" fill="#20362b" d="M405 1007H1471C1471 1140 1240 1248 938 1248C636 1248 405 1140 405 1007Z"/>
          <path class="logo-shine" stroke="#ffffff" d="M535 1057Q590 1125 683 1145" fill="none" stroke-width="36" stroke-linecap="round"/>
          <path class="logo-ink" fill="#20362b" d="M808 1262Q938 1275 1067 1262V1318Q1067 1346 1039 1346H836Q808 1346 808 1318Z"/>
        </svg>
        <span>솥뚜껑 포럼</span>
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="#/" data-nav="home">홈</a>
        <a href="#/dinner" data-nav="dinner">솥뚜껑 저녁 모임</a>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="테마 바꾸기">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 솥뚜껑 포럼 · 뜨겁게 끓고, 든든하게 덮어주는 이야기 마당</p>
    </div>
  </footer>

  <!-- ============ 홈 ============ -->
  <template id="tpl-home">
    <section class="hero-stage" aria-label="솥뚜껑 포럼 소개">
      <div class="hero-bg" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <button type="button" class="hero-logo-btn" id="heroLogo" aria-label="솥뚜껑 두드리기">
        <svg class="hero-logo" viewBox="230 40 1416 1320" aria-hidden="true">
          <g class="h-steam">
            <path d="M560 830 q-40 -90 0 -180 q40 -90 0 -180"/>
            <path d="M1090 840 q-40 -90 0 -180 q40 -90 0 -180"/>
            <path d="M1330 840 q-35 -80 0 -160 q35 -80 0 -160"/>
          </g>
          <g class="h-tree" style="--i:0"><g class="sway">
            <path fill="#2f8f50" d="M413 478Q436 450 460 478L555 830Q560 860 528 860H345Q313 860 320 830Z"/>
          </g></g>
          <g class="h-tree" style="--i:1"><g class="sway">
            <rect class="ink" x="627" y="690" width="56" height="170" rx="14"/>
            <circle fill="#7fc24d" cx="655" cy="566" r="138"/>
          </g></g>
          <g class="h-tree" style="--i:2"><g class="sway">
            <path fill="#2f8f50" d="M914 218Q938 190 962 218L1113 830Q1118 860 1086 860H790Q758 860 764 830Z"/>
          </g></g>
          <g class="h-tree" style="--i:3"><g class="sway">
            <rect class="ink" x="1189" y="710" width="56" height="150" rx="14"/>
            <circle fill="#7fc24d" cx="1217" cy="598" r="130"/>
          </g></g>
          <g class="h-tree" style="--i:4"><g class="sway">
            <path fill="#2f8f50" d="M1416 446Q1439 418 1462 446L1557 830Q1562 860 1530 860H1348Q1316 860 1322 830Z"/>
          </g></g>
          <g class="h-lid">
            <rect class="ink" x="243" y="881" width="1390" height="105" rx="52"/>
          </g>
          <g class="h-pot">
            <path class="ink" d="M405 1007H1471C1471 1140 1240 1248 938 1248C636 1248 405 1140 405 1007Z"/>
            <path class="h-shine" d="M535 1057Q590 1125 683 1145" fill="none" stroke-width="36" stroke-linecap="round"/>
            <path class="ink" d="M808 1262Q938 1275 1067 1262V1318Q1067 1346 1039 1346H836Q808 1346 808 1318Z"/>
          </g>
        </svg>
      </button>

      <h1 class="hero-title">
        <span style="--d:0">뜨겁게 끓고,</span>
        <span style="--d:1">든든하게 덮어주는</span>
        <span style="--d:2">이야기 마당</span>
      </h1>
      <p class="hero-sub">각자의 재료를 들고 와<br>솥뚜껑 위에서 함께 어우러지는 자리</p>
      <button type="button" class="scroll-cue" id="scrollCue" aria-label="아래로 이동">
        <span aria-hidden="true">↓</span>
      </button>
    </section>

    <section class="section reveal" id="dinnerTeaser">
      <p class="eyebrow">PROJECT 01</p>
      <div class="teaser card">
        <div class="teaser-text">
          <h2>솥뚜껑 저녁 모임</h2>
          <p>매월 마지막 주 금요일 저녁, 자기 그릇을 넓혀 가는 사람들이 각자의 재료를 들고 와
            솥뚜껑 위에서 함께 볶아요. 고정 멤버 세 사람이 매달 새로운 손님을 초대합니다.</p>
          <a class="btn btn-primary" href="#/dinner">초대장 열어보기 ✉️</a>
        </div>
        <div class="next-dinner" id="nextDinnerBox">
          <div class="mini-pot" aria-hidden="true">
            <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>
            <span class="lid"></span><span class="pot"></span>
          </div>
          <p class="next-label">다음 모임</p>
          <p class="next-date" data-next-date></p>
          <p class="next-dday" data-next-dday></p>
        </div>
      </div>
    </section>

    <section class="section reveal">
      <p class="eyebrow">COMING SOON</p>
      <h2 class="section-title">준비 중인 프로젝트</h2>
      <div class="soon-grid">
        <div class="soon-card">
          <div class="soon-lid" aria-hidden="true"><span>?</span></div>
          <p class="soon-no">PROJECT 02</p>
          <h3>뚜껑을 여는 중이에요</h3>
          <p>새로운 프로젝트를 지글지글 준비하고 있어요.</p>
        </div>
        <div class="soon-card">
          <div class="soon-lid" aria-hidden="true" style="--delay:.6s"><span>?</span></div>
          <p class="soon-no">PROJECT 03</p>
          <h3>재료를 고르는 중이에요</h3>
          <p>곧 맛있게 끓여서 소개할게요.</p>
        </div>
      </div>
    </section>

  </template>

  <!-- ============ 솥뚜껑 저녁 모임 ============ -->
  <template id="tpl-dinner">
    <section class="invite-stage" aria-label="초대장">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="letter">
          <p class="letter-kicker">INVITATION</p>
          <h1 class="letter-title">솥뚜껑 저녁 모임에<br>초대합니다</h1>
          <p class="letter-when">매월 마지막 주 금요일 저녁</p>
          <p class="letter-next" data-next-date-long></p>
        </div>
        <div class="env-pocket"></div>
        <div class="env-flap"></div>
        <div class="env-seal" aria-hidden="true">
          <svg viewBox="230 180 1416 1180">
            <path fill="#2f8f50" d="M413 478Q436 450 460 478L555 830Q560 860 528 860H345Q313 860 320 830Z"/>
            <circle fill="#7fc24d" cx="655" cy="566" r="138"/>
            <rect fill="#20362b" x="627" y="690" width="56" height="170" rx="14"/>
            <path fill="#2f8f50" d="M914 218Q938 190 962 218L1113 830Q1118 860 1086 860H790Q758 860 764 830Z"/>
            <circle fill="#7fc24d" cx="1217" cy="598" r="130"/>
            <rect fill="#20362b" x="1189" y="710" width="56" height="150" rx="14"/>
            <path fill="#2f8f50" d="M1416 446Q1439 418 1462 446L1557 830Q1562 860 1530 860H1348Q1316 860 1322 830Z"/>
            <rect fill="#20362b" x="243" y="881" width="1390" height="105" rx="52"/>
            <path fill="#20362b" d="M405 1007H1471C1471 1140 1240 1248 938 1248C636 1248 405 1140 405 1007Z"/>
            <path stroke="#ffffff" d="M535 1057Q590 1125 683 1145" fill="none" stroke-width="36" stroke-linecap="round"/>
            <path fill="#20362b" d="M808 1262Q938 1275 1067 1262V1318Q1067 1346 1039 1346H836Q808 1346 808 1318Z"/>
          </svg>
        </div>
      </div>
      <div class="invite-sparks" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <button type="button" class="btn btn-ghost replay-btn" id="replayInvite">↺ 초대장 다시 열기</button>
    </section>

    <section class="section reveal">
      <p class="eyebrow">ABOUT</p>
      <h2 class="section-title">이 자리를 여는 이유</h2>
      <div class="card about-card">
        <p>솥뚜껑은 넓습니다. 밥도, 김치도, 콩나물도 한 판에 올라가 함께 볶이며
          따로일 때는 낼 수 없던 맛을 냅니다.</p>
        <p><strong>이 자리의 재료는 각자의 삶입니다.</strong>
          자기 삶에 뚜렷한 목표를 품고, 더 많은 재료를 담을 수 있도록 자신의 그릇을 넓혀 가는 사람들이
          저마다의 재료를 들고 와 한 상에 둘러앉습니다.</p>
        <p>직함보다 이름으로 만나 서로의 일과 고민, 꿈을 나눕니다.
          매달 마지막 주 금요일, 고정 멤버 세 사람이 새로운 손님을 초대해 함께 지글지글 어우러집니다.</p>
        <p class="about-motto">각자의 재료를 들고 와, 함께 맛있어지는 저녁.</p>
      </div>
    </section>

    <section class="section reveal">
      <p class="eyebrow">HOSTS</p>
      <h2 class="section-title">고정 멤버</h2>
      <ul class="member-grid" id="memberGrid"></ul>
    </section>

    <section class="section">
      <p class="eyebrow">ROUNDS</p>
      <h2 class="section-title">모임 기록</h2>
      <ol class="timeline" id="roundList"></ol>
    </section>
  </template>

  <script src="app.js?v=10"></script>
</body>
</html>
