<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>솥뚜껑 포럼</title>
  <meta name="description" content="뜨겁게 끓고, 든든하게 덮어주는 이야기 마당 — 솥뚜껑 포럼">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="솥뚜껑 포럼 홈">
        <svg class="logo" viewBox="230 180 1416 1180" aria-hidden="true">
          <path class="logo-tree" d="M413 478Q436 450 460 478L555 830Q560 860 528 860H345Q313 860 320 830Z"/>
          <circle class="logo-leaf" cx="655" cy="566" r="138"/>
          <rect class="logo-ink" x="627" y="690" width="56" height="170" rx="14"/>
          <path class="logo-tree" d="M914 218Q938 190 962 218L1113 830Q1118 860 1086 860H790Q758 860 764 830Z"/>
          <circle class="logo-leaf" cx="1217" cy="598" r="130"/>
          <rect class="logo-ink" x="1189" y="710" width="56" height="150" rx="14"/>
          <path class="logo-tree" d="M1416 446Q1439 418 1462 446L1557 830Q1562 860 1530 860H1348Q1316 860 1322 830Z"/>
          <rect class="logo-ink" x="243" y="881" width="1390" height="105" rx="52"/>
          <path class="logo-ink" d="M405 1007H1471C1471 1140 1240 1248 938 1248C636 1248 405 1140 405 1007Z"/>
          <path class="logo-shine" d="M535 1057Q590 1125 683 1145" fill="none" stroke-width="36" stroke-linecap="round"/>
          <path class="logo-ink" d="M808 1262Q938 1275 1067 1262V1318Q1067 1346 1039 1346H836Q808 1346 808 1318Z"/>
        </svg>
        <span>솥뚜껑 포럼</span>
      </a>
      <nav class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="테마 바꾸기">◐</button>
        <a class="btn btn-primary" href="#/write">글쓰기</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 솥뚜껑 포럼 · 글은 이 브라우저에만 저장돼요.</p>
    </div>
  </footer>

  <template id="tpl-home">
    <section class="hero">
      <h1>뜨겁게 끓고, 든든하게 덮어주는 이야기 마당</h1>
      <p>잡담부터 질문, 정보 공유까지. 솥뚜껑 위에서 지글지글 나눠요.</p>
    </section>

    <div class="toolbar">
      <div class="tabs" role="tablist" id="categoryTabs"></div>
      <div class="toolbar-right">
        <input id="searchInput" type="search" placeholder="제목·내용 검색" aria-label="검색">
        <select id="sortSelect" aria-label="정렬">
          <option value="new">최신순</option>
          <option value="hot">인기순</option>
          <option value="comments">댓글순</option>
        </select>
      </div>
    </div>

    <ul class="post-list" id="postList"></ul>
    <p class="empty" id="emptyState" hidden>아직 글이 없어요. 첫 글을 올려보세요!</p>
  </template>

  <template id="tpl-write">
    <section class="card">
      <h1 class="page-title">새 글 쓰기</h1>
      <form id="writeForm" class="form" novalidate>
        <div class="row">
          <label>카테고리
            <select name="category" required></select>
          </label>
          <label>닉네임
            <input name="author" maxlength="20" placeholder="익명의 솥뚜껑" autocomplete="nickname">
          </label>
        </div>
        <label>제목
          <input name="title" maxlength="80" required placeholder="제목을 입력하세요">
        </label>
        <label>내용
          <textarea name="body" rows="10" maxlength="5000" required placeholder="하고 싶은 이야기를 적어주세요"></textarea>
        </label>
        <p class="form-error" id="formError" role="alert"></p>
        <div class="form-actions">
          <a class="btn" href="#/">취소</a>
          <button class="btn btn-primary" type="submit">올리기</button>
        </div>
      </form>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
